[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alma-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "playwright>=1.50,<2", "PyMuPDF>=1.25,<2", "pdfplumber>=0.11,<1", "regex>=2024.11", "platformdirs>=4,<5"]

[project.optional-dependencies]
ocr = ["opencv-python-headless>=4.10,<5", "pytesseract>=0.3.13,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
