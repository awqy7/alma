[package]
name = "alma-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
rust_decimal = "1"
thiserror = "2"
tempfile = "3"
base64 = "0.22"
tiny_http = "0.12"

[dev-dependencies]
